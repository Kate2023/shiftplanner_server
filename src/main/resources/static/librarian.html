<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shift Planner - Shift Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="brand-badge" aria-hidden="true">🗓️</div>
      <div>Shift Planner — Shift Dashboard</div>
    </div>
    <div class="nav">
      <button type="button" onclick="resetShift()">Reset</button>
      <button type="button" onclick="reviewSchedule()">Review</button>
      <button type="button" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="container">
    <div class="schedule-date-row">
     <label for="shiftDate">Shift date:</label>
     <input type="date" id="shiftDate" onchange="loadShiftDate()" />

     <div class="schedule-actions-group">
      <button type="button" class="btn" onclick="openAutoScheduleRulePopup()">Auto Completion</button>
      <div class="save-to-wrap">
      <button type="button" class="btn" onclick="openSaveToDatePicker()">Save to</button>
      <input
        type="date"
        id="saveToDate"
        class="save-to-date-popup-anchor"
        aria-label="Save schedule to date"
        onchange="saveShiftToSelectedDate()"
        tabindex="-1"
      />
    </div>
  </div>
</div>

      <div class="schedule-title">
        <h3 id="shiftScheduleTitle">Auckland Library — Wednesday, 10 June 2026</h3>
        <div class="subtle">Assign a task for each staff member at each time slot using the dropdown menu.</div>
      </div>

      <div class="calendar-wrapper">
        <table class="calendar-table">
          <thead>
            <tr id="shiftHeaderRow">
              <th class="time-cell">
                <button type="button" class="btn btn-primary" onclick="addStaffColumn()">Add staff</button>
              </th>
            </tr>
          </thead>
          <tbody id="shiftCalendarBody"></tbody>
        </table>
      </div>

      <div class="notes-area">
        <label for="shiftNotes">Notes</label>
        <textarea
          id="shiftNotes"
          placeholder="Add timetable notes here..."
          oninput="saveNotes('shiftNotes')"
        ></textarea>
      </div>

      <div class="daily-tasks">
        <div class="mini-card">
          <h4>Roster</h4>
          <label for="dutyRoster">Roster</label>
          <select id="dutyRoster" onchange="saveDailyAssignments()"></select>
        </div>
        <div class="mini-card">
          <h4>Banking</h4>
          <label for="dutyBanking">Banking</label>
          <select id="dutyBanking" onchange="saveDailyAssignments()"></select>
        </div>
        <div class="mini-card">
          <h4>Banking Backup</h4>
          <label for="dutyBankingBackup">Banking Backup</label>
          <select id="dutyBankingBackup" onchange="saveDailyAssignments()"></select>
        </div>
        <div class="mini-card">
          <h4>Daily Building Inspection</h4>
          <label for="dutyInspection">Daily Building Inspection</label>
          <select id="dutyInspection" onchange="saveDailyAssignments()"></select>
        </div>
      </div>
    </div>

  <div id="autoScheduleRuleModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="autoRuleModalTitle">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header-row">
        <h3 id="autoRuleModalTitle">Auto Completion Rules</h3>
        <button type="button" class="btn" onclick="closeAutoScheduleRulePopup()">Close</button>
      </div>

      <div class="auto-rule-top-actions">
        <label class="auto-rule-toggle">
          <span>Select all</span>
          <input type="checkbox" id="autoRuleSelectAllCheckbox" />
        </label>
        <label class="auto-rule-toggle auto-rule-confirm-toggle" id="autoRuleConfirmToggle">
          <span id="autoRuleConfirmText">Confirm</span>
          <input type="checkbox" id="autoRuleConfirmCheckbox" />
        </label>
      </div>

      <div id="autoRuleList" class="auto-rule-list"></div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", initLibrarianPage);
  </script>
</body>
</html>
